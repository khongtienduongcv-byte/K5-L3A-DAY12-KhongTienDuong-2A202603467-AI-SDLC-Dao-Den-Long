<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đảo Đèn Lồng — Day 12 AI SDLC</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: #090a10;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #fff;
    }
    #game-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
    }
    #hud {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }
    .hud-card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 12px 18px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }
    .hud-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #94a3b8;
      margin-bottom: 4px;
    }
    .hud-value {
      font-size: 20px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #controls-hint {
      position: absolute;
      bottom: 20px;
      left: 20px;
      z-index: 10;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 13px;
      color: #cbd5e1;
      pointer-events: none;
    }
    #controls-hint span {
      background: rgba(255, 255, 255, 0.15);
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
      color: #fbbf24;
    }
    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(10, 10, 20, 0.85);
      backdrop-filter: blur(12px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    #overlay h1 {
      font-size: 48px;
      margin-bottom: 12px;
      font-weight: 800;
    }
    #overlay p {
      font-size: 18px;
      color: #cbd5e1;
      margin-bottom: 24px;
    }
    #overlay .stats {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 16px 32px;
      margin-bottom: 24px;
      font-size: 18px;
      line-height: 1.8;
      text-align: center;
    }
    #restart-btn {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #fff;
      border: none;
      padding: 12px 32px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 9999px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.4);
      transition: all 0.2s ease;
    }
    #restart-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.6);
    }
    #notification {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      background: rgba(245, 158, 11, 0.9);
      color: #000;
      font-weight: 700;
      padding: 8px 20px;
      border-radius: 9999px;
      box-shadow: 0 4px 16px rgba(245, 158, 11, 0.5);
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>

  <div id="hud">
    <div class="hud-card">
      <div class="hud-title">Ngọn lửa của Mây</div>
      <div id="flames-val" class="hud-value">🔥 🔥 🔥</div>
    </div>
    <div class="hud-card">
      <div class="hud-title">Đom đóm mang theo</div>
      <div id="motes-val" class="hud-value" style="color: #fde047;">🟡 0 / 5</div>
    </div>
    <div class="hud-card">
      <div class="hud-title">Đèn Lồng Lớn</div>
      <div id="lanterns-val" class="hud-value" style="color: #fb923c;">🏮 0 / 5</div>
    </div>
    <div class="hud-card">
      <div class="hud-title">Thời gian còn lại</div>
      <div id="time-val" class="hud-value" style="color: #38bdf8;">⏳ 03:00</div>
    </div>
    <div class="hud-card">
      <div class="hud-title">Điểm số</div>
      <div id="score-val" class="hud-value" style="color: #a78bfa;">🏆 0</div>
    </div>
  </div>

  <div id="controls-hint">
    <span>W</span><span>A</span><span>S</span><span>D</span> Di chuyển &nbsp;|&nbsp; 
    <span>E</span> Nạp đèn &nbsp;|&nbsp; 
    <span>Space</span> / <span>Q</span> Tỏa sáng (xua bóng mực)
  </div>

  <div id="notification">Thông báo</div>

  <div id="overlay">
    <h1 id="overlay-title">CHIẾN THẮNG!</h1>
    <p id="overlay-desc">Mây đã thắp sáng tất cả các ngọn đèn trên đảo!</p>
    <div class="stats" id="overlay-stats">
      Điểm số: 0
    </div>
    <button id="restart-btn">Chơi Lại (Phím R)</button>
  </div>

  <script type="module" src="/src/render/game3d.js"></script>
</body>
</html>
